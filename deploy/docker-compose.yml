name: real-time-dash

# Infra local da Fase 2: barramento de eventos + cache de dedup.
# Redpanda é Kafka-compatível (API Kafka) e roda single-node sem ZooKeeper —
# o doc permite "Apache Kafka / Redpanda" para o barramento.
#
#   make infra-up     # sobe tudo e cria o tópico market.trades (3 partições)
#   make infra-down   # derruba e remove volumes
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    container_name: rtd-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"   # Kafka API
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.*true|Controller ID: [0-9]+' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    container_name: rtd-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    # Compartilha o namespace de rede do redpanda: rpk fala diretamente
    # em localhost:9092, sem depender de DNS/hairpin entre containers.
    network_mode: service:redpanda
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rpk topic create market.trades --brokers localhost:9092 -p 3 -r 1 || true
        rpk topic describe market.trades --brokers localhost:9092

  redis:
    image: redis:7-alpine
    container_name: rtd-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Observabilidade (Fase 3): Prometheus raspando gateway (host:9090), BFF
  # (host:8080) e core (host:8081); Grafana com dashboard "Market Data
  # Overview" provisionado; Jaeger para tracing OTLP (4317/4318).
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: rtd-prometheus
    ports:
      - "9093:9090"   # UI (host 9090 fica com o gateway)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rtd-grafana
    ports:
      - "3000:3000"   # UI (admin/admin)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    container_name: rtd-jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  redpanda-data:
  prometheus-data:
  grafana-data:
